services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ergonomic
      POSTGRES_USER: ergonomic
      POSTGRES_PASSWORD: ergonomic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://ergonomic:ergonomic@postgres:5432/ergonomic
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - postgres
volumes:
  postgres_data:
